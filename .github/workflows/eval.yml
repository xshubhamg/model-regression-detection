name: eval

on:
  push:
    paths:
      - "src/**"
      - "prompts/**"
      - "golden/**"
      - "pyproject.toml"
  pull_request:
  workflow_dispatch: # manual live run from the Actions tab

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: Run golden eval (live model via repo secrets, mock when unset)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: uv run python -m model_regression_detection.eval --prompt v1 --json-out last_run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            last_run.json
            report.html
            slack_payload.json
