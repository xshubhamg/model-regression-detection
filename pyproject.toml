[project]
name = "model-regression-detection"
version = "0.1.0"
description = "CI/CD-style pipeline that tests any LLM feature against a golden dataset, detects regressions, and alerts before bad outputs ship."
authors = [{ name = "Shubham Giri" }]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "streamlit>=1.63.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_regression_detection"]
